server {
    # Port > 1024 : un processus non-root ne peut pas écouter sur 80
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Sonde liveness/readiness, sans journaliser chaque appel du kubelet
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fichiers avec hash dans le nom (main-ABC123.js) : cache long sans risque
    location ~* \.(js|css|ico|png|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback SPA : toute route inconnue renvoie index.html (jamais mis en cache)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
