# Service "headless" (clusterIP: None) : pas d'IP virtuelle ni de load balancing,
# le DNS renvoie directement l'IP du pod. C'est le type requis par un StatefulSet
# (serviceName) pour donner un nom DNS stable à chaque pod (…-postgresql-0).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubesentinel.postgresql.fullname" . }}
  labels:
    {{- include "kubesentinel.labels" (dict "ctx" . "component" "postgresql") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "kubesentinel.selectorLabels" (dict "ctx" . "component" "postgresql") | nindent 4 }}
  ports:
    - name: postgresql
      port: {{ .Values.postgresql.port }}
      targetPort: postgresql
