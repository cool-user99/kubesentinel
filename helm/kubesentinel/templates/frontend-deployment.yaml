{{- $fe := .Values.frontend }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubesentinel.fullname" . }}-frontend
  labels:
    {{- include "kubesentinel.labels" (dict "ctx" . "component" "frontend") | nindent 4 }}
spec:
  replicas: {{ $fe.replicaCount }}
  selector:
    matchLabels:
      {{- include "kubesentinel.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubesentinel.labels" (dict "ctx" . "component" "frontend") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        # UID 101 = utilisateur "nginx" de l'image nginx-unprivileged
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: "{{ $fe.image.repository }}:{{ $fe.image.tag }}"
          imagePullPolicy: {{ $fe.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $fe.containerPort }}
          # Fichiers statiques, aucune dépendance : les deux sondes peuvent viser /healthz
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml $fe.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx-unprivileged écrit son PID et ses fichiers temporaires dans /tmp
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
