{{- $pg := .Values.postgresql }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "kubesentinel.postgresql.fullname" . }}
  labels:
    {{- include "kubesentinel.labels" (dict "ctx" . "component" "postgresql") | nindent 4 }}
spec:
  # Une seule instance : pas de réplication PostgreSQL dans ce projet (voir limites du README)
  replicas: 1
  serviceName: {{ include "kubesentinel.postgresql.fullname" . }}
  selector:
    matchLabels:
      {{- include "kubesentinel.selectorLabels" (dict "ctx" . "component" "postgresql") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubesentinel.labels" (dict "ctx" . "component" "postgresql") | nindent 8 }}
    spec:
      # La base n'appelle pas l'API Kubernetes : pas besoin de jeton monté dans le pod
      automountServiceAccountToken: false
      securityContext:
        # UID 70 = utilisateur "postgres" de l'image alpine officielle
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: "{{ $pg.image.repository }}:{{ $pg.image.tag }}"
          imagePullPolicy: {{ $pg.image.pullPolicy }}
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ $pg.auth.database | quote }}
            - name: POSTGRES_USER
              value: {{ $pg.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $pg.auth.existingSecret }}
                  key: {{ $pg.auth.secretKey }}
            # Sous-dossier : initdb exige un répertoire vide, la racine d'un volume ne l'est pas toujours
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # pg_isready teste que le serveur accepte les connexions.
          # sh -c pour que $POSTGRES_USER soit lu depuis l'environnement du conteneur.
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 5
            periodSeconds: 10
          # Plus tolérante que la readiness : un redémarrage de base coûte cher
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: initdb
          configMap:
            name: {{ include "kubesentinel.postgresql.fullname" . }}-initdb
  # Un PVC par pod (data-…-postgresql-0), conservé même si le StatefulSet est supprimé
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $pg.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $pg.persistence.size }}
