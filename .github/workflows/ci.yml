# Chaîne CI : lint et tests → build → scan Trivy → push GHCR → mise à jour de values.yaml.
# Le déploiement n'est pas ici : ArgoCD détecte le commit de mise à jour et synchronise le cluster.
name: CI

on:
  push:
    branches: [main]
    paths: &watched-paths
      - "app/**"
      - "helm/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths: *watched-paths

# Moindre privilège : lecture seule par défaut, chaque job n'élargit que ce dont il a besoin
permissions:
  contents: read

# Deux pushes rapprochés s'exécutent l'un après l'autre : le dernier tag écrit reste le plus récent
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-api:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app/api
    steps:
      # Actions épinglées par SHA : un tag peut être déplacé par un attaquant, pas un SHA
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt ruff==0.17.3
      - run: ruff check .
      - run: python -m pytest -v

  lint-chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: helm lint helm/kubesentinel
      # Détecte les erreurs de rendu que le lint ne voit pas
      - run: helm template kubesentinel helm/kubesentinel > /dev/null

  build-scan-push:
    needs: [test-api, lint-chart]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      # Laisse finir l'autre image : on voit toutes les CVE d'un coup
      fail-fast: false
      matrix:
        component: [api, frontend]
    env:
      TRIVY: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Calculer le nom de l'image
        run: |
          # GHCR exige des minuscules ; le tag est le SHA du commit, donc immuable et traçable
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kubesentinel-${{ matrix.component }}:sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Construire l'image
        run: |
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$IMAGE" "app/${{ matrix.component }}"

      - name: Rapport Trivy (CRITICAL et HIGH, non bloquant)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache \
            "$TRIVY" image --severity CRITICAL,HIGH --exit-code 0 --no-progress --format table "$IMAGE"

      - name: Scan Trivy bloquant (CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache \
            "$TRIVY" image --severity CRITICAL --exit-code 1 --no-progress --quiet --format table "$IMAGE"

      # Les étapes suivantes ne s'exécutent que si le scan est passé.
      # On pousse exactement l'image scannée : pas de nouveau build entre le scan et le push.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pousser l'image sur GHCR
        if: github.event_name == 'push'
        run: docker push "$IMAGE"

  update-values:
    # needs : si une seule image échoue, le tag ne change pas et le cluster reste sur la version saine
    needs: build-scan-push
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Écrire les images dans values.yaml
        run: |
          for component in api frontend; do
            COMPONENT="$component" \
            REPOSITORY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kubesentinel-$component" \
            TAG="sha-${GITHUB_SHA::7}" \
            yq -i '.[strenv(COMPONENT)].image.repository = strenv(REPOSITORY) | .[strenv(COMPONENT)].image.tag = strenv(TAG)' \
              helm/kubesentinel/values.yaml
          done
          git diff

      - name: Commiter la mise à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/kubesentinel/values.yaml
          # [skip ci] : ce commit ne doit pas relancer la chaîne (pas de boucle infinie)
          git commit -m "chore(helm): deploy images sha-${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
